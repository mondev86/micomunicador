services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: pictogramas
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: ./laravel-backend
    depends_on:
      - mysql
    environment:
      APP_NAME: MiComunicadorSaaS
      APP_ENV: local
      APP_KEY: base64:change-me
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      FRONTEND_URL: http://localhost:4174
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: pictogramas
      DB_USERNAME: root
      DB_PASSWORD: root
      CORS_ALLOWED_ORIGINS: http://localhost:4174
    ports:
      - "8000:8000"
    volumes:
      - ./laravel-backend:/var/www/html

volumes:
  mysql_data:
